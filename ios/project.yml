name: Douzangjia
options:
  bundleIdPrefix: com.douzangjia
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "32"
    DEVELOPMENT_TEAM: 57PCGYACA7
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
targets:
  Douzangjia:
    type: application
    platform: iOS
    sources:
      - path: Douzangjia
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.douzangjia.app
        PRODUCT_NAME: Douzangjia
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Douzangjia/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 抖藏家
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photo-and-video
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "把作品存到手机相册时需要这个权限，抖藏家只会写入你选择保存的视频或图片。"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "抖藏家需要访问局域网，才能连上你 NAS 上的收藏库。"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_PREVIEWS: YES
  DouzangjiaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DouzangjiaTests
    dependencies:
      - target: Douzangjia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.douzangjia.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Douzangjia.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Douzangjia"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Douzangjia:
    build:
      targets:
        Douzangjia: all
    test:
      targets:
        - DouzangjiaTests
    archive:
      config: Release
