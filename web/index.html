<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>抖藏家</title>
    <script>
      (() => {
        let theme = "dark";
        try {
          const stored = window.localStorage.getItem("liuying.theme.v1");
          if (stored === "light") theme = "light";
          if (stored === "system" && window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0b0b0d" : "#f5f5f3";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
