name: douzangjia

services:
  archive:
    build:
      context: .
      args:
        # Leave these unset for official registries; set them in .env for mirrors.
        NODE_IMAGE: "${NODE_IMAGE:-node:22-bookworm-slim}"
        PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.13-slim-bookworm}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org/}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-}"
        PLAYWRIGHT_DOWNLOAD_HOST: "${PLAYWRIGHT_DOWNLOAD_HOST:-}"
        APP_COMMIT: "${APP_COMMIT:-unknown}"
    image: douzangjia:local
    container_name: douzangjia
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ARCHIVE_ROOT: /archive
      ARCHIVE_MASTER_KEY: "${ARCHIVE_MASTER_KEY:?required}"
      APP_BIND_HOST: 0.0.0.0
      APP_PORT: "8099"
      SYNC_INTERVAL_SECONDS: "300"
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "${APP_PORT:-8099}:8099"
    volumes:
      - "${ARCHIVE_PATH:-./archive-data}:/archive"
    tmpfs:
      # Chromium keeps its shared memory here (--disable-dev-shm-usage); 1g ran
      # out while scrolling long feeds and crashed the renderer.
      - /tmp:rw,nosuid,nodev,size=4g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health/ready')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    stop_grace_period: 30s
